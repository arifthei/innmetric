[build]
  base = "web"
  command = "npm --prefix .. run lint:copy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[context.production.environment]
  INNMETRIC_FORMS_ENABLED = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "http://www.innmetric.com/*"
  to = "https://innmetric.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.innmetric.com/*"
  to = "https://innmetric.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tr"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tr/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/_context"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/_context/*"
  to = "/"
  status = 404
  force = true
