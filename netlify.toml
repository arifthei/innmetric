[build]
  publish = "."
  command = "npm run lint:copy"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/tr"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tr/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/_context"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/_context/*"
  to = "/"
  status = 404
  force = true
