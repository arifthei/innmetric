[build]
  publish = "."
  command = "echo 'static site'"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/tr"
  to = "/tr/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
