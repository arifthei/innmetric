[build]
  base = "web"
  # stage:collab builds the pinned guided demo into web/public/collab/ (see web/collab.source.json).
  command = "npm --prefix .. run lint:copy && npm run stage:collab && npm run build"
  publish = ".next"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  INNMETRIC_FORMS_ENABLED = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Guided demo at /collab/: canonical URLs end in a slash. A redirect rule cannot add it (Netlify matches
# /path and /path/ alike, so the rule would loop); the edge function only runs on these three paths.
[[edge_functions]]
  function = "collab-trailing-slash"
  path = "/collab"

[[edge_functions]]
  function = "collab-trailing-slash"
  path = "/collab/partners/ireckonu"

[[edge_functions]]
  function = "collab-trailing-slash"
  path = "/collab/partners/torus-legacy"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/collab/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/collab/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "http://www.innmetric.com/*"
  to = "https://innmetric.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.innmetric.com/*"
  to = "https://innmetric.com/:splat"
  status = 301
  force = true

# The collab-demo function owns the three demo API routes and uses this release's fixtures.

# Known demo entry points only. No /collab/* fallback, so a missing asset stays a 404.
[[redirects]]
  from = "/collab/"
  to = "/collab/index.html"
  status = 200

[[redirects]]
  from = "/collab/partners/ireckonu/"
  to = "/collab/partners/ireckonu/index.html"
  status = 200

[[redirects]]
  from = "/collab/partners/torus-legacy/"
  to = "/collab/partners/torus-legacy/index.html"
  status = 200

[[redirects]]
  from = "/archive/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/_context"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/_context/*"
  to = "/"
  status = 404
  force = true
