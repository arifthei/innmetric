<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative distribution control loop</title>
  <desc id="desc">Six labelled stages from Detect through Recheck. Illustrative example. Not a client record.</desc>
  <rect width="920" height="280" rx="16" fill="#0d1526"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#082f49">
    <rect x="24" y="90" width="120" height="56" rx="12" fill="#38bdf8"/>
    <text x="84" y="124" text-anchor="middle">Detect</text>
    <rect x="176" y="90" width="120" height="56" rx="12" fill="#38bdf8"/>
    <text x="236" y="124" text-anchor="middle">Evidence</text>
    <rect x="328" y="90" width="120" height="56" rx="12" fill="#38bdf8"/>
    <text x="388" y="124" text-anchor="middle">Approve</text>
    <rect x="480" y="90" width="120" height="56" rx="12" fill="#38bdf8"/>
    <text x="540" y="124" text-anchor="middle">Repair</text>
    <rect x="632" y="90" width="120" height="56" rx="12" fill="#38bdf8"/>
    <text x="692" y="124" text-anchor="middle">Verify</text>
    <rect x="784" y="90" width="112" height="56" rx="12" fill="#38bdf8"/>
    <text x="840" y="124" text-anchor="middle">Recheck</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M144 118h32M296 118h32M448 118h32M600 118h32M752 118h32"/>
  </g>
  <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="13" fill="#bae6fd">CONTROL LOOP</text>
  <text x="24" y="250" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Illustrative example. Not a client record.</text>
</svg>
