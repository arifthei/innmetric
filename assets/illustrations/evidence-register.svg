<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative evidence register</title>
  <desc id="desc">Sample columns for observation, conditions, status and owner. Illustrative example. Not a client record.</desc>
  <rect width="920" height="320" rx="16" fill="#0d1526"/>
  <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="13" fill="#bae6fd">EVIDENCE REGISTER</text>
  <g font-family="Inter, Arial, sans-serif" font-size="13">
    <rect x="24" y="64" width="872" height="36" rx="8" fill="#111827"/>
    <text x="40" y="87" fill="#f8fafc" font-weight="700">Observation</text>
    <text x="360" y="87" fill="#f8fafc" font-weight="700">Conditions</text>
    <text x="600" y="87" fill="#f8fafc" font-weight="700">Status</text>
    <text x="760" y="87" fill="#f8fafc" font-weight="700">Owner</text>
    <text x="40" y="140" fill="#a8b8cc">Direct rate shown below OTA</text>
    <text x="360" y="140" fill="#a8b8cc">2 adults, 1 night, SAR</text>
    <text x="600" y="140" fill="#38bdf8">Hypothesis</text>
    <text x="760" y="140" fill="#a8b8cc">Hotel</text>
    <text x="40" y="184" fill="#a8b8cc">Room type missing on one OTA</text>
    <text x="360" y="184" fill="#a8b8cc">Stay start plus 14 days</text>
    <text x="600" y="184" fill="#38bdf8">Confirmed</text>
    <text x="760" y="184" fill="#a8b8cc">InnMetric</text>
    <text x="40" y="228" fill="#a8b8cc">Stop-sell after mapping change</text>
    <text x="360" y="228" fill="#a8b8cc">Logged-out desktop</text>
    <text x="600" y="228" fill="#38bdf8">Needs approval</text>
    <text x="760" y="228" fill="#a8b8cc">GM</text>
  </g>
  <text x="24" y="292" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Illustrative example. Not a client record.</text>
</svg>
